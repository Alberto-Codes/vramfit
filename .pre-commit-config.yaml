# Commit stage = fast hermetic gates; push stage = full suite with
# thorough hypothesis profile, e2e, and the coverage gate (ADR-0009).
default_stages: [pre-commit]

repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.10.7
    hooks:
      - id: uv-lock

  - repo: https://github.com/owenlamont/uv-secure
    rev: 0.17.0
    hooks:
      - id: uv-secure

  - repo: local
    hooks:
      - id: ty-check
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (fast, unit+contract)
        entry: uv run pytest --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-push
        name: pytest full (thorough + e2e + coverage)
        entry: >-
          env HYPOTHESIS_PROFILE=thorough
          uv run pytest -m "not gpu and not integration"
          --cov=quantfit --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: loc-check
        name: file size limit (300/320 code lines)
        entry: uv run python scripts/check_loc.py src
        language: system
        pass_filenames: false
        always_run: true

      - id: doc-refs
        name: docs reference living module paths
        entry: uv run python scripts/check_doc_refs.py
        language: system
        pass_filenames: false
        always_run: true

      - id: docvet
        name: docvet check
        entry: uv run docvet check --staged
        language: system
        pass_filenames: false
        always_run: true
