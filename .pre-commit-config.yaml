# Commit stage = fast hermetic gates; push stage = full suite with
# thorough hypothesis profile, e2e, and the coverage gate (ADR-0009).
#
# Every Python tool here runs from the project environment through
# `uv run`. The lockfile then pins one version for both this hook line
# and CI. A pre-commit mirror carries its own pin. That pin drifts
# from the lockfile CI installs, and the two gates disagree. The drift
# once forced `E402` into `extend-select`. It later required
# contradictory code for `BLE001`.
#
# Two tools stay unaligned, both tracked on #245:
#
# - actionlint is a Go binary. The lockfile names no version for it.
#   The CI step pins the same 1.7.11 this mirror does.
# - docvet runs here from the lockfile and in CI from a pinned action.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: uv run yamllint -c .yamllint.yaml .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      # Both filters restate the mirrors they replace. `uv lock
      # --check` reports a stale lockfile where the mirror's bare
      # `uv lock` rewrote it, matching CI.
      - id: uv-lock
        name: uv lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$

      # A `pyproject.toml` edit changes no dependency without also
      # changing `uv.lock`. Adding it here would run the scanner on a
      # comment change, and the scanner crashes intermittently (#46).
      - id: uv-secure
        name: uv-secure
        entry: uv run uv-secure
        language: system
        pass_filenames: false
        files: (^|.*/)(uv\.lock|requirements\.txt)$

      - id: ty-check
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (fast, unit+contract)
        entry: uv run pytest --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-push
        name: pytest full (thorough + e2e + coverage)
        entry: >-
          env HYPOTHESIS_PROFILE=thorough
          uv run pytest -m "not gpu and not integration"
          --cov=vramfit --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Second coverage run, own threshold (#364, ruled 2026-09-04).
      # `--cov=scripts` replaces the pyproject source list for this
      # run only. The floor sits below the 50 % measured on
      # 2026-09-04. Raise it as the scripts gain tests. CI mirrors
      # the same flags.
      - id: pytest-push-scripts
        name: pytest scripts coverage (48% floor)
        entry: >-
          uv run pytest -m "not gpu and not integration"
          --cov=scripts --cov-fail-under=48 --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The integration tier (#470, ruled 2026-09-04). Its modules
      # call `pytest.importorskip("torch")`, so the step skips with
      # the reason "scan extra not installed" where the extra is
      # absent, and `-rs` prints that reason. It costs about 7
      # seconds where the extra is installed. CI has no torch and
      # carries no mirror.
      - id: pytest-push-integration
        name: pytest integration (skips without the scan extra)
        entry: >-
          uv run pytest -m "integration and not gpu"
          --tb=short -q -rs
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: loc-check
        name: file size limit (300/320 code lines)
        entry: uv run python scripts/check_loc.py src
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-overrides
        name: lazy optional imports carry a ty override entry
        entry: uv run python scripts/check_ty_overrides.py
        language: system
        pass_filenames: false
        always_run: true

      - id: doc-refs
        name: docs reference living module paths
        entry: uv run python scripts/check_doc_refs.py
        language: system
        pass_filenames: false
        always_run: true

      - id: banned-terms
        name: pre-rename tool name stays out of the tree
        entry: uv run python scripts/check_banned_terms.py
        language: system
        pass_filenames: false
        always_run: true

      - id: docvet
        name: docvet check
        entry: uv run docvet check --staged
        language: system
        pass_filenames: false
        always_run: true
