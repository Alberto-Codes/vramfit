# Commit stage = fast hermetic gates; push stage = full suite with
# thorough hypothesis profile, e2e, and the coverage gate (ADR-0009).
#
# Every Python tool runs from the project environment through
# `uv run`, so the lockfile is the only place a version is pinned.
# A pre-commit mirror carries its own pin, which drifts from the
# lockfile CI installs and makes the two gates disagree. That drift
# once forced `E402` into `extend-select` and once required
# contradictory code for `BLE001`.
#
# actionlint stays a mirror: it is a Go binary with no entry in the
# lockfile, so there is no project version for it to align to.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: uv run yamllint -c .yamllint.yaml
        language: system
        types: [yaml]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: uv-lock
        name: uv lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: uv-secure
        name: uv-secure
        entry: uv run uv-secure
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: ty-check
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (fast, unit+contract)
        entry: uv run pytest --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-push
        name: pytest full (thorough + e2e + coverage)
        entry: >-
          env HYPOTHESIS_PROFILE=thorough
          uv run pytest -m "not gpu and not integration"
          --cov=vramfit --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: loc-check
        name: file size limit (300/320 code lines)
        entry: uv run python scripts/check_loc.py src
        language: system
        pass_filenames: false
        always_run: true

      - id: doc-refs
        name: docs reference living module paths
        entry: uv run python scripts/check_doc_refs.py
        language: system
        pass_filenames: false
        always_run: true

      - id: banned-terms
        name: pre-rename tool name stays out of the tree
        entry: uv run python scripts/check_banned_terms.py
        language: system
        pass_filenames: false
        always_run: true

      - id: docvet
        name: docvet check
        entry: uv run docvet check --staged
        language: system
        pass_filenames: false
        always_run: true
