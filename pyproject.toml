[project]
name = "quantfit"
version = "0.1.0"
description = "Selective per-layer quantization to fit large open models on a single GPU"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Alberto-Codes", email = "alberto.codes.dev@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = [
    "cuda",
    "gguf",
    "inference",
    "llm",
    "local-llm",
    "mixed-precision",
    "model-compression",
    "nemotron",
    "quantization",
    "sensitivity-analysis",
    "vllm",
]
dependencies = [
    "typer>=0.9",
]

[project.optional-dependencies]
# The scan extra carries the GPU stack (ADR-0005): the base install and
# the plan step stay importable without torch.
scan = [
    "accelerate>=1.0",
    "torch>=2.4",
    # The floor is where from_pretrained's dtype kwarg landed — older
    # versions ignore it silently and load fp32 at twice the memory.
    "transformers>=4.56",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=1.0",
]

[project.scripts]
quantfit = "quantfit.adapters.inbound.cli:app"

[project.urls]
Homepage = "https://github.com/Alberto-Codes/quantfit"
Source = "https://github.com/Alberto-Codes/quantfit"
Issues = "https://github.com/Alberto-Codes/quantfit/issues"
Changelog = "https://github.com/Alberto-Codes/quantfit/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- #
# uv-secure
# --------------------------------------------------------------------------- #
[tool.uv-secure.vulnerability_criteria]
ignore_vulnerabilities = []
allow_unused_ignores = false

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
# Sonar-adjacent set: PL/C901 (complexity), B (bugbear), SIM (simplify),
# TRY (exception hygiene), S (bandit), PERF, RUF, UP, G on top of the
# house baseline E501/I/D.
extend-select = [
    "E402",  # enabled explicitly: hook and locked ruff versions differ on the default
    "E501",
    "I",
    "D",
    "B",
    "SIM",
    "UP",
    "RUF",
    "PL",
    "C901",
    "TRY",
    "PERF",
    "S",
    "G",
]
ignore = [
    "TRY003",  # long messages in raises — our validation errors carry context
]

[tool.ruff.lint.mccabe]
# Buffer under the SonarQube cognitive-complexity threshold of 15.
max-complexity = 12

[tool.ruff.lint.pylint]
# Match Sonar's parameter-count threshold (S107 default 7).
max-args = 7

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "S106",  # tokenizer special-token strings are not passwords
    "S311",  # non-crypto randomness is fine for shuffle tests
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "PLR2004",  # magic values are the point of test assertions
    "PLC0415",  # torch-tier tests import the scan extra lazily to skip cleanly
]
"src/quantfit/adapters/inbound/cli.py" = [
    "PLR0913",  # typer commands take one arg per CLI option by design
    "PLR0917",
]
"src/quantfit/adapters/inbound/cli_scan.py" = [
    "PLR0913",  # typer commands take one arg per CLI option by design
    "PLR0917",
]
"src/quantfit/adapters/outbound/scan/meter.py" = [
    "PLR0913",  # the meter constructor mirrors the scan command's options
    "PLR0917",
]
"src/quantfit/adapters/outbound/hf_config.py" = [
    "TRY004",  # config validation raises ValueError by documented contract
]

[tool.ruff.lint.isort]
known-first-party = ["quantfit"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# --------------------------------------------------------------------------- #
# Docvet
# --------------------------------------------------------------------------- #
[tool.docvet]
fail-on = ["enrichment", "freshness", "coverage", "griffe", "presence"]

[tool.docvet.presence]
min-coverage = 100.0

# --------------------------------------------------------------------------- #
# Ty (type checker)
# --------------------------------------------------------------------------- #
[tool.ty.src]
include = ["src", "tests"]

# The scan adapter and its torch-tier tests import torch and
# transformers, which CI and torch-less dev boxes do not install
# (ADR-0005). Everything else still type-checks strictly.
[[tool.ty.overrides]]
include = [
    "src/quantfit/adapters/outbound/scan/**",
    "tests/conftest.py",
    "tests/contract/test_damage_meter_contract.py",
    "tests/integration/test_torch_scan_adapter.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, isolated, no GPU); includes hypothesis properties",
    "contract: Verified-fake port suites — real and fake adapters proven equivalent",
    "integration: Real external resources (model weights, GPU runtimes); resource-gated",
    "e2e: Full stack through the console script via subprocess",
    "gpu: Tests that require a CUDA device",
    "slow: Slow-running tests",
]
# Default run is the hermetic fast suite (unit + contract). Tier selection
# per ADR-0009; a CLI -m flag overrides this.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "-m",
    "not gpu and not integration and not e2e and not slow",
]

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
source = ["quantfit"]
# The torch adapter runs only where the scan extra is installed. The
# hermetic suites prove its orchestration via verified fakes (ADR-0009)
# and its own tests carry the integration/slow markers (CPU is enough).
omit = ["*/adapters/outbound/scan/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

# --------------------------------------------------------------------------- #
# import-linter
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_package = "quantfit"
include_external_packages = true
exclude_type_checking_imports = true

# The hex lookup map (ADR-0008): inbound drives, outbound implements
# ports, domain stays pure. Higher layers may import lower, never the
# reverse.
[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "quantfit.adapters.inbound",
    "quantfit.adapters.outbound",
    "quantfit.ports",
    "quantfit.domain",
]

[[tool.importlinter.contracts]]
# The domain is pure: no file IO, no JSON, no CLI framework. Serialization
# and IO belong to adapters (ADR-0008).
name = "Domain is IO-free"
type = "forbidden"
source_modules = ["quantfit.domain"]
forbidden_modules = ["json", "pathlib", "os", "io", "typer"]

[[tool.importlinter.contracts]]
# Executable form of ADR-0005: the plan step stays importable without
# torch. The torch-touching scan adapter package is the one carve-out —
# the CLI imports it lazily inside the scan command.
name = "No heavy ML deps outside the scan adapter package"
type = "forbidden"
source_modules = ["quantfit"]
forbidden_modules = ["torch", "transformers", "accelerate", "safetensors", "vllm"]
ignore_imports = [
    "quantfit.adapters.outbound.scan.* -> torch",
    "quantfit.adapters.outbound.scan.* -> transformers",
]

# --------------------------------------------------------------------------- #
# Dev dependencies
# --------------------------------------------------------------------------- #
[dependency-groups]
dev = [
    "docvet>=1.15",
    "hypothesis>=6.100",
    "import-linter>=2.11",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "pytest-randomly>=4.0",
    "ruff>=0.11",
    "ty>=0.0.1a33",
    "uv-secure>=0.17.0",
]
