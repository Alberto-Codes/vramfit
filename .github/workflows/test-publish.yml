name: Test Publish

# Manual dry run of the publish path against TestPyPI. Proves the build
# gates, the OIDC trusted publisher, and the upload before a real release.
on:
  workflow_dispatch:

concurrency:
  group: test-publish
  cancel-in-progress: false # never cancel an in-flight upload

jobs:
  test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: testpypi
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build --no-sources

      - name: Smoke test wheel contents
        run: |
          WHEEL=$(ls dist/*.whl)
          SIZE=$(stat --format=%s "$WHEEL")
          if [ "$SIZE" -gt 512000 ]; then
            echo "::error::Wheel size ${SIZE} bytes exceeds 500KB limit"
            exit 1
          fi
          echo "Wheel size: ${SIZE} bytes — OK"

          CONTENTS=$(unzip -l "$WHEEL")
          for UNWANTED in "tests/" "docs/" "scripts/"; do
            if echo "$CONTENTS" | grep -q "$UNWANTED"; then
              echo "::error::Wheel contains ${UNWANTED}"
              exit 1
            fi
          done
          if ! echo "$CONTENTS" | grep -q "vramfit/py.typed"; then
            echo "::error::Wheel omits the py.typed marker"
            exit 1
          fi
          echo "Wheel contents clean — OK"

      # ADR-0005: the base install carries typer and structlog only.
      - name: Verify the base install carries no GPU dependency
        run: |
          WHEEL=$(ls dist/*.whl)
          METADATA=$(unzip -p "$WHEEL" '*.dist-info/METADATA')
          BASE=$(echo "$METADATA" | grep '^Requires-Dist:' | grep -v 'extra ==' || true)
          echo "Base requirements:"
          echo "$BASE"
          # An empty result means the metadata never parsed. Without this the
          # grep below passes on nothing and reports a torch-free build.
          if [ -z "$BASE" ]; then
            echo "::error::Read no unconditional Requires-Dist from the wheel metadata"
            exit 1
          fi
          if echo "$BASE" | grep -qE 'torch|transformers|accelerate|safetensors|gguf'; then
            echo "::error::A GPU dependency escaped an extra into the base install (ADR-0005)"
            exit 1
          fi
          echo "Base install is torch-free — OK"

      - name: Install and verify wheel
        run: |
          uv venv /tmp/smoke --python 3.12
          SMOKE=/tmp/smoke/bin
          uv pip install --python "$SMOKE/python" dist/*.whl
          "$SMOKE/vramfit" version
          "$SMOKE/vramfit" plan --help > /dev/null
          "$SMOKE/vramfit" budget --help > /dev/null

      # --trusted-publishing always, not the default `automatic`. On a failed
      # OIDC exchange `automatic` retries unauthenticated and reports 403.
      # This workflow exists to prove the trusted publisher, so demand it.
      - name: Publish to TestPyPI
        run: |
          ALL_TRANSIENT=1
          for attempt in 1 2 3 4 5; do
            echo "Attempt ${attempt} of 5..."
            if OUTPUT=$(uv publish --index testpypi --trusted-publishing always 2>&1); then
              echo "$OUTPUT"
              echo "Published successfully on attempt ${attempt}"
              exit 0
            fi
            echo "$OUTPUT"
            # Only a 503 counts as transient. One real error on any attempt
            # denies the escape hatch below for the whole run. The pattern
            # demands status context so a bare 503 in a byte count or a hash
            # cannot pass a real failure off as infrastructure.
            if ! echo "$OUTPUT" | grep -qiE 'service unavailable|(http|status)[^0-9]{0,8}503'; then
              ALL_TRANSIENT=0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Upload failed, retrying in 30s..."
              sleep 30
            fi
          done
          if [ "$ALL_TRANSIENT" -eq 1 ]; then
            echo "::warning::TestPyPI returned 503 on all 5 attempts — infrastructure issue, not a pipeline problem"
            exit 0
          fi
          echo "::error::All 5 publish attempts failed"
          exit 1
