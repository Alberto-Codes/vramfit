name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Retry once on exit 3 only — the scanner's advisory-fetch
      # crash class (issue #46). Real findings exit 1 and still
      # fail immediately.
      - name: uv-secure
        run: |
          code=0
          uv run uv-secure || code=$?
          if [ "$code" -eq 3 ]; then
            echo "uv-secure crashed (exit 3) — one retry, issue #46"
            uv run uv-secure
          else
            exit "$code"
          fi
      - run: uv run yamllint -c .yamllint.yaml .
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - run: uv run ty check
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  # The backstop for the hook line (ADR-0008/0009): hooks can be
  # bypassed, CI cannot. Hex layers, domain purity, no-torch, the
  # 300/320 code-line cap, and living doc references.
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - run: uv run lint-imports
      - run: uv run python scripts/check_loc.py src
      - run: uv run python scripts/check_doc_refs.py
      - run: uv run python scripts/check_banned_terms.py
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  # Mirrors the pre-push gate: thorough hypothesis profile, e2e
  # included, 90% coverage floor from pyproject. GPU and integration
  # tiers stay out — CI has neither the card nor the weights.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - run: >-
          uv run pytest -m "not gpu and not integration"
          --cov=vramfit --cov-report=term-missing --tb=short
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          HYPOTHESIS_PROFILE: thorough
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  # The gguf-py contract suites guard on import and skip wherever
  # gguf is absent, so the test job never runs them (#197). This job
  # installs the gguf dependency group and runs the contract tier.
  # The group carries gguf-py and numpy without torch. The marker
  # expression keeps the resource tiers out, matching the addopts
  # default — a bare `-m contract` would replace that deselection.
  # The import step fails loudly when gguf is missing. Without it a
  # broken install skips green.
  test-gguf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: gguf
      - run: uv python install 3.12
      - run: uv sync --locked --dev --group gguf
      - run: uv run python -c "import gguf, numpy"
      - run: >-
          uv run pytest --tb=short
          -m "contract and not gpu and not integration and not e2e and not slow"
      - run: uv cache prune --ci
        if: always()
        continue-on-error: true

  docvet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: Alberto-Codes/docvet@257310e5edc8249629d388d879a5afde602f02ca  # v1
        with:
          checks: "all"
